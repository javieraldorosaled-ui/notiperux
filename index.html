    <meta http-equiv="Expires" content="0" />

    <script>
      (function () {
        if (typeof window.__deferredPwaPrompt === 'undefined') {
          window.__deferredPwaPrompt = null;
        }
        if (typeof window.__isPwaInstalled === 'undefined') {
          window.__isPwaInstalled = false;
        }
        try {
          if (
            window.matchMedia('(display-mode: standalone)').matches ||
            window.navigator.standalone === true
          ) {
            window.__isPwaInstalled = true;
          }
        } catch (e) {}

        window.__refreshPwaManifest = function () {
          try {
            var link = document.getElementById('pwa-manifest-link');
            if (link && !window.__deferredPwaPrompt && !window.__isPwaInstalled) {
              link.setAttribute('href', '/manifest.json?v=' + Date.now());
            }
          } catch (e) {}
        };

        window.addEventListener('beforeinstallprompt', function (event) {
          event.preventDefault();
          window.__deferredPwaPrompt = event;
          window.__isPwaInstalled = false;
          try {
            localStorage.removeItem('notiperux_pwa_installed');
          } catch (e) {}
          window.dispatchEvent(new CustomEvent('pwa:beforeinstallprompt'));
        });

        window.addEventListener('appinstalled', function () {
          window.__deferredPwaPrompt = null;
          window.__isPwaInstalled = true;
          try {
            localStorage.setItem('notiperux_pwa_installed', '1');
          } catch (e) {}
          window.dispatchEvent(new CustomEvent('pwa:appinstalled'));
        });

        window.addEventListener('unhandledrejection', function (event) {
          if (
            event &&
            event.reason &&
            (String(event.reason).indexOf('ServiceWorker') !== -1 ||
              (event.reason.message && event.reason.message.indexOf('ServiceWorker') !== -1))
          ) {
            event.preventDefault();
          }
        });

        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function () {
            navigator.serviceWorker
              .register('/sw.js', { scope: '/' })
              .then(function (reg) {
                if (reg && typeof reg.update === 'function') {
                  reg.update().catch(function () {});
                }

                // Chequeo periódico cada 10 minutos
                setInterval(function () {
                  if (reg && typeof reg.update === 'function') {
                    reg.update().catch(function () {});
                  }
                }, 10 * 60 * 1000);

                // Chequear actualización al volver a la app o desbloquear el móvil
                document.addEventListener('visibilitychange', function () {
                  if (document.visibilityState === 'visible' && reg && typeof reg.update === 'function') {
                    reg.update().catch(function () {});
                  }
                });
              })
              .catch(function () {});
          });
        }
      })();
    </script>
