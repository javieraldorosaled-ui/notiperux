<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#165338" />
      <stop offset="60%" stop-color="#123C28" />
      <stop offset="100%" stop-color="#102610" />
    </linearGradient>
    <linearGradient id="hillBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E6B49" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#102610" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="hillFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#257D55" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0D2110" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Fondo institucional verde andino -->
  <rect width="800" height="420" fill="url(#bgGrad)" />

  <!-- Sol andino suave -->
  <circle cx="650" cy="110" r="64" fill="#FDEDD4" fill-opacity="0.12" />
  <circle cx="650" cy="110" r="42" fill="#FDEDD4" fill-opacity="0.18" />

  <!-- Silueta cordillera de Huánuco / Pillco Mozo -->
  <path d="M 0 320 L 130 175 L 245 255 L 395 135 L 545 250 L 675 180 L 800 290 L 800 420 L 0 420 Z" fill="url(#hillBack)" />
  <path d="M 0 350 L 185 235 L 320 305 L 485 205 L 640 295 L 800 230 L 800 420 L 0 420 Z" fill="url(#hillFront)" />

  <!-- Silueta estilizada del Puente Calicanto sobre el río Huallaga -->
  <g transform="translate(220, 285)" opacity="0.28">
    <rect x="0" y="20" width="360" height="10" rx="4" fill="#D8EACF" />
    <path d="M 0 30 L 0 70 L 30 70 C 30 42 90 42 90 70 L 135 70 C 135 42 225 42 225 70 L 270 70 C 270 42 330 42 330 70 L 360 70 L 360 30 Z" fill="#D8EACF" />
  </g>

  <!-- Tarjeta central de respaldo institucional -->
  <rect x="170" y="96" width="460" height="210" rx="24" fill="#102610" fill-opacity="0.58" stroke="#BAD0B5" stroke-opacity="0.45" stroke-width="2" />

  <!-- Icono de periódico regional -->
  <g transform="translate(372, 122)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="#D8EACF" fill-opacity="0.18" stroke="#D8EACF" stroke-width="2" />
    <path d="M 16 16 H 34 V 38 H 16 Z" fill="none" stroke="#FDEDD4" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M 34 22 H 40 V 36 C 40 37.5 38.8 38 37 38 H 34" fill="none" stroke="#FDEDD4" stroke-width="2.5" stroke-linejoin="round" />
    <line x1="21" y1="22" x2="29" y2="22" stroke="#D8EACF" stroke-width="2.5" stroke-linecap="round" />
    <line x1="21" y1="27" x2="29" y2="27" stroke="#D8EACF" stroke-width="2.5" stroke-linecap="round" />
    <line x1="21" y1="32" x2="26" y2="32" stroke="#D8EACF" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Textos claros de respaldo institucional -->
  <text x="400" y="214" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800" fill="#FDEDD4" letter-spacing="1.5" text-anchor="middle">
    ACTUALIDAD REGIONAL · HUÁNUCO
  </text>
  <text x="400" y="244" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600" fill="#D8EACF" letter-spacing="0.5" text-anchor="middle">
    Imagen institucional de respaldo · Fuente sin fotografía adjunta
  </text>
  <text x="400" y="274" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#BAD0B5" letter-spacing="2" text-anchor="middle">
    HUANUREBAJAS · INFORMACIÓN VERIFICADA
  </text>
</svg>
