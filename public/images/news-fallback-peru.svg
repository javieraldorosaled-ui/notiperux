      <stop offset="0%" stop-color="#143D28"/>
      <stop offset="50%" stop-color="#1B5E20"/>
      <stop offset="100%" stop-color="#0E281A"/>
    </linearGradient>
    <linearGradient id="flagRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D32F2F"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgPeru)"/>
  <circle cx="400" cy="210" r="140" fill="#ffffff" fill-opacity="0.04"/>
  <circle cx="400" cy="210" r="100" fill="#ffffff" fill-opacity="0.06"/>
