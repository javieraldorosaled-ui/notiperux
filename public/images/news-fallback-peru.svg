  <rect x="388" y="255" width="24" height="6" rx="2" fill="#FFFFFF"/>
  <rect x="416" y="255" width="24" height="6" rx="2" fill="url(#flagRed)"/>
  <!-- Text -->
  <text x="400" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">NOTICIAS DEL PERÚ</text>
  <text x="400" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#A5D6A7" text-anchor="middle" letter-spacing="0.5">ACTUALIDAD NACIONAL · FUENTE VERIFICADA</text>
